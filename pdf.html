<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export as PDF</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
        Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    /* Toolbar is only visible on screen, never in the printed output. */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: #333333;
      color: #ffffff;
      font-size: 14px;
    }

    .toolbar button {
      padding: 6px 14px;
      border: 0;
      border-radius: 6px;
      background: #ffffff;
      color: #333333;
      font-size: 14px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #e5e5e5;
    }

    /* A4-like sheet so the on-screen preview matches the printed page. */
    #content {
      box-sizing: border-box;
      max-width: 21cm;
      min-height: 29.7cm;
      margin: 16px auto;
      padding: 1.6cm;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
    }

    #content > :first-child {
      margin-top: 0;
    }

    h1, h2, h3, h4, h5, h6 {
      line-height: 1.3;
      margin: 1.4em 0 0.6em;
    }

    h1 { font-size: 1.9em; border-bottom: 1px solid #d8dee4; padding-bottom: 0.3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid #d8dee4; padding-bottom: 0.3em; }
    h3 { font-size: 1.25em; }

    a {
      color: #0969da;
      word-break: break-all;
    }

    /* Long code lines must wrap instead of being clipped on paper. */
    pre {
      overflow: visible;
      white-space: pre-wrap;
      word-wrap: break-word;
      padding: 12px 14px;
      border-radius: 6px;
      background: #f6f8fa;
      font-size: 0.88em;
      line-height: 1.5;
      page-break-inside: avoid;
    }

    code {
      padding: 0.15em 0.4em;
      border-radius: 4px;
      background: #f6f8fa;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", monospace;
      font-size: 0.9em;
    }

    pre code {
      padding: 0;
      background: none;
      font-size: 1em;
    }

    blockquote {
      margin: 1em 0;
      padding: 0 1em;
      border-left: 4px solid #d0d7de;
      color: #57606a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      page-break-inside: avoid;
    }

    th, td {
      padding: 6px 13px;
      border: 1px solid #d0d7de;
    }

    th {
      background: #f6f8fa;
      text-align: left;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    hr {
      height: 1px;
      border: 0;
      background: #d0d7de;
      margin: 1.6em 0;
    }

    /* Page setup for the generated PDF. */
    @page {
      size: A4;
      margin: 1.4cm;
    }

    @media print {
      body {
        background: #ffffff;
      }

      .toolbar {
        display: none !important;
      }

      #content {
        max-width: none;
        min-height: 0;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="print-button" type="button">Print / Save as PDF</button>
    <span>Choose "Save as PDF" as the destination in the print dialog.</span>
  </div>

  <main id="content"></main>

  <script src="vendor/marked.js"></script>
  <script src="pdf.js"></script>
</body>
</html>
